name: Validate CogniCare PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./dev.db
      COGNICARE_ENABLE_DEMO_LOGIN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Prepare synthetic seed data
        run: npm run db:reset
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Server build
        run: npm run build
      - name: Static export build
        run: npm run build:static
